# JitPack builds with JDK 25, like CI, and publishes the library modules (see build.gradle.kts).
# SDKMAN only lists the latest Temurin 25 patch, so look up its identifier instead of pinning one.
before_install:
  - export JDK=$(curl -s "https://api.sdkman.io/2/candidates/java/linuxx64/versions/list?current=&installed=" | grep -o "25\.[0-9.+]*-tem" | head -1)
  - sdk install java $JDK
  - sdk use java $JDK
install:
  - sed -i 's|services.gradle.org/distributions|mirrors.huaweicloud.com/gradle|; s|networkTimeout=10000|networkTimeout=60000|' gradle/wrapper/gradle-wrapper.properties
  - ./gradlew :latex:publishToMavenLocal :text:publishToMavenLocal :markdown:publishToMavenLocal :highlight:publishToMavenLocal :bom:publishToMavenLocal
